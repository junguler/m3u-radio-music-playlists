name: Deploy File Viewer

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # Pinned on purpose: ubuntu-latest is migrating to 26.04 in stages, so it
    # can resolve to different images between runs. Change to ubuntu-26.04
    # once you have tested it.
    runs-on: ubuntu-24.04
    # Normal runs take about 4 minutes. 10 minutes leaves headroom but makes
    # a stalled run fail fast so it can be re-run.
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history is required: generate_index.js reads it to get each
          # file's real last-modified date.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Writes file_index_lean.json (names only, loaded first by the viewer) and
      # file_index.json (full details). --apply-layout also rearranges this
      # throwaway checkout the way the index shows it: in every folder that has a
      # "checked" folder, the normal files are removed and the checked files move
      # up into the folder. The repository itself is not touched. To turn the
      # collapsing off, change COLLAPSE_CHECKED at the top of generate_index.js.
      - name: Generate file index
        run: node generate_index.js --apply-layout

      - name: Check file index
        run: |
          node -e '
            const fs = require("fs");
            const i = JSON.parse(fs.readFileSync("file_index.json", "utf8"));
            const l = JSON.parse(fs.readFileSync("file_index_lean.json", "utf8"));
            if (!i.stats || i.stats.files < 1) { console.error("file_index.json has no files"); process.exit(1); }
            if (!l.stats || l.stats.files !== i.stats.files || l.stats.dirs !== i.stats.dirs) { console.error("file_index_lean.json does not match file_index.json"); process.exit(1); }
            console.log("file indexes OK:", i.stats.files, "files,", i.stats.dirs, "folders");
          '

      # Files starting with "---" are flagged `external` in file_index.json.
      # They stay listed in the viewer (which links to them on GitHub) but are
      # removed from this throwaway checkout so they are not tarred, uploaded
      # or deployed. Nothing in the repository itself is touched.
      - name: Leave large files out of the site
        run: |
          node -e '
            const fs = require("fs");
            const idx = JSON.parse(fs.readFileSync("file_index.json", "utf8"));
            let n = 0, bytes = 0;
            (function walk(items, prefix) {
              for (const it of items) {
                const p = prefix ? prefix + "/" + it.name : it.name;
                if (it.type === "directory") walk(it.children, p);
                else if (it.external) { fs.rmSync(p); n++; bytes += it.size; }
              }
            })(idx.root, "");
            console.log("Left out " + n + " files (" + (bytes / 1048576).toFixed(1) + " MB) from the site");
          '

      # Informational only: shows how much is about to be tarred and uploaded.
      # Safe to delete once you no longer need to watch the site size.
      - name: Report upload size
        run: |
          echo "Files to upload (excluding .git and .github):"
          find . -type f -not -path "./.git/*" -not -path "./.github/*" | wc -l
          echo "Total size (actual bytes, not disk blocks):"
          du -sh --apparent-size --exclude=.git --exclude=.github . || true
          echo "Ten largest files:"
          # The awk does the top-10 selection itself, so no pipe is closed early
          # (the old `sort | head` printed a harmless "Broken pipe" message).
          find . -type f -not -path "./.git/*" -not -path "./.github/*" -printf '%s %p\n' \
            | sort -nr \
            | awk 'NR <= 10 { printf "%8.1f MB  %s\n", $1/1048576, $2 }'
          # GitHub documents a 1 GB limit for published Pages sites. This only
          # raises a warning on the run page; it never fails the build.
          bytes=$(find . -type f -not -path "./.git/*" -not -path "./.github/*" -printf '%s\n' | awk '{ s += $1 } END { print s + 0 }')
          if [ "$bytes" -gt 1073741824 ]; then
            echo "::warning title=Site is over GitHub Pages' 1 GB limit::The upload is $((bytes / 1048576)) MB"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        # A stalled upload fails after 8 minutes instead of eating the whole job.
        timeout-minutes: 8
        uses: actions/upload-pages-artifact@v5
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
