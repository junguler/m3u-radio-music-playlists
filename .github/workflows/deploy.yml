name: Deploy File Viewer

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Normal runs take about 4-5 minutes. 10 minutes leaves headroom but makes
    # a stalled run fail fast so it can be re-run.
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history is required: generate_index.js reads it to get each
          # file's real last-modified date.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Generate file index
        run: node generate_index.js

      - name: Check file index
        run: |
          node -e '
            const i = JSON.parse(require("fs").readFileSync("file_index.json", "utf8"));
            if (!i.stats || i.stats.files < 1) { console.error("file_index.json has no files"); process.exit(1); }
            console.log("file_index.json OK:", i.stats.files, "files,", i.stats.dirs, "folders");
          '

      # Informational only: shows how much is about to be tarred and uploaded,
      # so a slow run can be compared against the size of the site.
      - name: Report upload size
        run: |
          echo "Files to upload (excluding .git and .github):"
          find . -type f -not -path "./.git/*" -not -path "./.github/*" | wc -l
          echo "Total size:"
          du -sh --exclude=.git --exclude=.github . || true
          echo "Ten largest files:"
          find . -type f -not -path "./.git/*" -not -path "./.github/*" -printf '%s %p\n' \
            | sort -nr | head -10 \
            | awk '{ printf "%8.1f MB  %s\n", $1/1048576, $2 }'

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        # A stalled upload fails after 8 minutes instead of eating the whole job.
        timeout-minutes: 8
        uses: actions/upload-pages-artifact@v5
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
